    <script>
        const chart = document.getElementById("chart");
        var url = new URL(window.location.href);
        
        var points = new Map([
            ['lib', 0.0],
            ['con', 0.0],
            ['geo', 0.0],
            ['marx', 0.0],
            ['prim', 0.0],
            ['nazi', 0.0]
        ]);

        var pointLocations = new Map([
            ['lib', [373, 300]],
            ['con', [373, 100]],
            ['geo', [200, 400]],
            ['marx', [27, 300]],
            ['prim', [27, 100]],
            ['nazi', [200, 0]]

        ])

        function sign (p1, p2, p3) {
            return (p1[0] - p3[0]) * (p2[1] - p3[1]) - (p2[0] - p3[0]) * (p1[1] - p3[1]);
        }
        function PointInTriangle (pt, v1, v2, v3) {
            var d1, d2, d3;
            var has_neg, has_pos;

            d1 = sign(pt, v1, v2);
            d2 = sign(pt, v2, v3);
            d3 = sign(pt, v3, v1);

            has_neg = (d1 < 0) || (d2 < 0) || (d3 < 0);
            has_pos = (d1 > 0) || (d2 > 0) || (d3 > 0);

            return !(has_neg && has_pos);
        }
        
        const sections = ['e', 'r'];
        for (j in sections) {
            let sectionLetter = sections[j];
            for (i = 0; i < 100; i++) {
                let val = url.searchParams.get(sectionLetter + "q" + i);
                if (val == null) {
                    continue;
                }
                let stuff = val.split('_');
                let num = parseInt(stuff[1]);
                let group = stuff[0];
                points.set(group, points.get(group) + num);
            }
        }

        var highest = 0.0;
        var total = 0;
        points.forEach(function(value, key, map) {
            highest = Math.max(highest, value);
            total += value;
        })

        let sum = [0, 0];

        points.forEach(function(value, key, map) {
            let portion = value / total;
            let loc = pointLocations.get(key)
            sum[0] += loc[0] * portion;
            sum[1] += loc[1] * portion;
        })

        sum = [200 + (sum[0] - 200) * 0.98, 200 + (sum[1] - 200) * 0.98];

        const dot = chart.getElementById("dot");
        dot.setAttribute("cx", sum[0]);
        dot.setAttribute("cy", sum[1]);

        const ideaContainer = chart.getElementById("ideologies");
        let ideology = null;
        ideaContainer.childNodes.forEach(function(value, index, array) {
            if (value.points) {
                let pts = value.points;
                let idk = PointInTriangle(sum, [pts[0].x, pts[0].y, pts[0].z], [pts[1].x, pts[1].y, pts[1].z], [pts[2].x, pts[2].y, pts[2].z]);
                if (idk) {
                    ideology = value.id;
                }
            }
        })
        chart.getElementById(ideology).setAttribute("visibility", "visible");

        const filePath = "/blurb/" + ideology + ".txt";
        var headerText = null;
        var bodyText = null;

        fetch(filePath)
            .then(r=>r.text())
            .then(text => {
                let stuff = text.split("\n");
                headerText = stuff[0];
                bodyText = stuff[1];
                
                document.getElementById("matchHeader").innerHTML = headerText;
                document.getElementById("matchBody").innerHTML = bodyText;
            })
        
    </script>
